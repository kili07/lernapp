<!DOCTYPE html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0e14">
<meta name="description" content="PDFs und GoodNotes-Mitschriften rein, Karteikarten, Quiz und Lernzettel raus.">
<title>Lernapp</title>
<script>
/* Theme setzen, bevor das Stylesheet greift — sonst blitzt beim Start kurz das
   Standard-Theme auf. Eigener, winziger Schlüssel: den kompletten Datensatz
   hier zu parsen würde den Start bremsen. app.js hält ihn synchron. */
(function () {
  try {
    var t = localStorage.getItem('lernapp.theme');
    if (t) document.documentElement.dataset.theme = t;
  } catch (e) { /* privater Modus o.ä. — dann bleibt es beim Standard */ }
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lernapp">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn hidden" id="btnBack" aria-label="Zurück">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
  </button>
  <h1 id="viewTitle">Heute</h1>
  <div class="top-actions" id="topActions"></div>
  <button class="icon-btn" id="btnSettings" aria-label="Einstellungen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
  </button>
</header>

<main id="main">
  <section class="view" id="view-home"></section>
  <section class="view hidden" id="view-library"></section>
  <section class="view hidden" id="view-practice"></section>
  <section class="view hidden" id="view-stats"></section>
  <section class="view hidden" id="view-deck"></section>
  <section class="view hidden" id="view-cards"></section>
  <section class="view hidden" id="view-study"></section>
  <section class="view hidden" id="view-quiz"></section>
  <section class="view hidden" id="view-match"></section>
  <section class="view hidden" id="view-notes"></section>
  <section class="view hidden" id="view-doc"></section>
  <section class="view hidden" id="view-chat"></section>
  <section class="view hidden" id="view-feynman"></section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-nav="home" class="on">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M10 20v-6h4v6"/></svg>
    <span>Heute</span>
  </button>
  <button data-nav="library">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="14" height="13" rx="2"/><path d="M7 4h12a2 2 0 0 1 2 2v11"/></svg>
    <span>Stapel</span>
  </button>
  <button id="btnAdd" class="fab-tab" aria-label="Material hinzufügen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>
  <button data-nav="practice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/></svg>
    <span>Üben</span>
  </button>
  <button data-nav="stats">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
    <span>Statistik</span>
  </button>
</nav>

<!-- Sheet: trägt alle Formulare und Dialoge -->
<div class="scrim hidden" id="scrim"></div>
<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheet-grip"></div>
  <div class="sheet-head">
    <button class="link" id="sheetCancel">Abbrechen</button>
    <strong id="sheetTitle"></strong>
    <button class="link strong" id="sheetSave">Sichern</button>
  </div>
  <div class="sheet-body" id="sheetBody"></div>
</div>

<!-- Ganzflächige Ebene: Bildkarten-Editor -->
<div class="overlay hidden" id="overlay"></div>

<!-- Beim Ziehen einer Datei über das Fenster -->
<div class="drop-hint hidden" id="dropHint">
  <div>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
    <strong>Loslassen zum Hinzufügen</strong>
    <span>PDF, GoodNotes-Export, Foto oder Textdatei</span>
  </div>
</div>

<input type="file" id="fileIn" class="hidden" multiple accept="application/pdf,.pdf,image/*,.txt,.md,text/plain,text/markdown">
<input type="file" id="deckIn" class="hidden" accept="application/json,.json,.txt">

<div class="busy hidden" id="busy"><div class="spinner"></div><span id="busyText"></span></div>
<div class="toast hidden" id="toast" role="status" aria-live="polite"></div>

<script src="core.js"></script>
<script src="ai.js"></script>
<script src="app.js"></script>
</body>
</html>
